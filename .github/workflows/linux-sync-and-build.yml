name: Linux sync and build
on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: Upstream stable/rc dsh-v tag (empty for verification only)
        type: string
        default: ''
      verify_ref:
        description: Exact 40-character sync branch SHA to verify
        type: string
        default: ''
      dry_run:
        description: Build and verify without branch push, PR, merge or release
        type: boolean
        default: true
      release:
        description: Publish an existing sync PR after verifying verify_ref
        type: boolean
        default: false
      force_resync:
        description: Replace sync/<tag> even when an open PR already tracks it
        type: boolean
        default: false
  pull_request:
    branches: [linux]
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: linux-sync-and-build
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'sync/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_TAG: ${{ inputs.target_tag }}
      VERIFY_REF: ${{ inputs.verify_ref }}
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
      RELEASE_EXISTING: ${{ inputs.release }}
      FORCE_RESYNC: ${{ inputs.force_resync }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      DSH_DESKTOP_TARGET_PLATFORM: linux
      DSH_DESKTOP_TARGET_ARCH: x64
    outputs:
      candidate_sha: ${{ steps.checkpoint.outputs.candidate_sha }}
      needs_decision: ${{ steps.checkpoint.outputs.needs_decision }}
      has_bundle: ${{ steps.bundle.outputs.has_bundle }}
      base_sha: ${{ steps.source.outputs.base_sha }}
      target_tag: ${{ steps.source.outputs.target_tag }}
      dry_run: ${{ steps.source.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: linux
          fetch-depth: 0
      - name: Configure sync identity and inputs
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "DSH_DESKTOP_PACKAGE_CACHE_DIR=$RUNNER_TEMP/dsh-desktop-package-cache" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          git config user.name 'kazv'
          git config user.email '70378740+k-azv@users.noreply.github.com'
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch origin linux
          BASE_SHA=$(git rev-parse origin/linux)
          if [[ -n "$PR_HEAD" ]]; then
            VERIFY_REF=$PR_HEAD
            TARGET_TAG=${PR_BRANCH#sync/}
          fi
          if [[ -n "$TARGET_TAG" && ! "$TARGET_TAG" =~ ^dsh-v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo 'Invalid target_tag' >&2
            exit 1
          fi
          if [[ -n "$VERIFY_REF" && ! "$VERIFY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'verify_ref must be an exact SHA' >&2
            exit 1
          fi
          if [[ -n "$TARGET_TAG" ]]; then
            SYNC_BRANCH="sync/$TARGET_TAG"
          else
            SYNC_BRANCH=''
            DRY_RUN=true
          fi
          if [[ -n "$TARGET_TAG" && -z "$VERIFY_REF" && "$DRY_RUN" != true && "$FORCE_RESYNC" != true ]]; then
            open_pr=$(gh pr list --base linux --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
            if [[ -n "$open_pr" ]]; then
              echo "Open PR #$open_pr already tracks $SYNC_BRANCH; close it or rerun with force_resync=true" >&2
              exit 1
            fi
          fi
          echo "TARGET_TAG=$TARGET_TAG" >> "$GITHUB_ENV"
          echo "VERIFY_REF=$VERIFY_REF" >> "$GITHUB_ENV"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "SYNC_BRANCH=$SYNC_BRANCH" >> "$GITHUB_ENV"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          {
            echo "base_sha=$BASE_SHA"
            echo "target_tag=$TARGET_TAG"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          # Keep downstream control scripts available even during a conflicted upstream merge.
          cp -r scripts/linux-dist "$RUNNER_TEMP/linux-control"
      - name: Free disk space and install Linux dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y rpm xvfb dbus-x11 libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libsecret-1-0
          df -h
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.PNPM_CONFIG_STORE_DIR }}
            ${{ env.DSH_DESKTOP_PACKAGE_CACHE_DIR }}
          key: dsh-linux-package-cache-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: dsh-linux-package-cache-v1-
      - name: Prepare exact source or merge upstream
        id: prepare
        run: |
          set -euo pipefail
          if [[ -n "$VERIFY_REF" ]]; then
            if [[ -n "$SYNC_BRANCH" ]]; then
              git fetch origin "refs/heads/$SYNC_BRANCH"
              [[ "$(git rev-parse FETCH_HEAD)" == "$VERIFY_REF" ]] || { echo "$SYNC_BRANCH moved from $VERIFY_REF" >&2; exit 1; }
              git checkout -B "$SYNC_BRANCH" "$VERIFY_REF"
            else
              git fetch origin "$VERIFY_REF"
              git checkout --detach "$VERIFY_REF"
            fi
            git merge-base --is-ancestor "$BASE_SHA" HEAD
          elif [[ -n "$TARGET_TAG" ]]; then
            git fetch upstream "refs/tags/$TARGET_TAG:refs/tags/$TARGET_TAG"
            git checkout -B "$SYNC_BRANCH" "$BASE_SHA"
            set +e
            git merge --no-commit --no-ff "$TARGET_TAG" >"$RUNNER_TEMP/linux-merge.log" 2>&1
            merge_result=$?
            set -e
            cat "$RUNNER_TEMP/linux-merge.log"
            git rm -rf --ignore-unmatch -- .github/workflows .github/dependabot.yml
            git checkout "$BASE_SHA" -- .github/workflows
            [[ -z "$(git diff --cached --name-only -- .github/workflows .github/dependabot.yml)" ]] || { echo 'Upstream workflows or dependabot config entered the merge index' >&2; exit 1; }
            [[ -z "$(git status --porcelain --untracked-files=all -- .github/workflows .github/dependabot.yml scripts/linux-dist)" ]] || {
              echo 'Protected automation paths changed during merge' >&2
              exit 1
            }
            if [[ $merge_result != 0 ]] && { [[ -n "$(git diff --name-only --diff-filter=U)" ]] || ! git rev-parse -q --verify MERGE_HEAD >/dev/null; }; then
              echo 'merge_failed=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Resolve merge conflicts with bounded Codex
        if: steps.prepare.outputs.merge_failed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          set -euo pipefail
          classification=$(node "$RUNNER_TEMP/linux-control/classify-failure.mjs" "$RUNNER_TEMP/linux-merge.log" merge)
          [[ $(jq -r .action <<< "$classification") == heal ]] || { echo "$classification"; exit 1; }
          npm install --prefix "$RUNNER_TEMP/codex-cli" --no-audit --no-fund @openai/codex
          export PATH="$RUNNER_TEMP/codex-cli/node_modules/.bin:$PATH"
          "$RUNNER_TEMP/linux-control/prepare-codex-sandbox.sh"
          "$RUNNER_TEMP/linux-control/run-codex-heal.sh" "$RUNNER_TEMP/linux-merge.log"
      - name: Stage resolved conflicts and commit sync checkpoint
        id: checkpoint
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/linux-control/stage-resolved-conflicts.sh"
          if [[ -n "$TARGET_TAG" && -z "$VERIFY_REF" ]]; then
            [[ -z "$(git status --porcelain --untracked-files=all -- .github/workflows .github/dependabot.yml scripts/linux-dist)" ]] || {
              echo 'Protected automation paths changed before sync commit' >&2
              exit 1
            }
            printf '%s\n' "$TARGET_TAG" > scripts/linux-dist/state/last-synced-tag.txt
            git add -A
            protected=$(git diff --cached --name-only -- .github/workflows .github/dependabot.yml scripts/linux-dist)
            if [[ -n "$protected" && "$protected" != "scripts/linux-dist/state/last-synced-tag.txt" ]]; then
              echo 'Automation files changed during sync/healing:' >&2
              printf '%s\n' "$protected" >&2
              exit 1
            fi
            if ! git diff --cached --quiet || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              git -c core.hooksPath=/dev/null commit -m "Sync Linux desktop with $TARGET_TAG"
            fi
          else
            protected=$(git diff --cached --name-only -- .github/workflows .github/dependabot.yml scripts/linux-dist)
            [[ -z "$protected" ]] || { echo 'Automation files changed during verification checkout' >&2; exit 1; }
          fi
          if [[ "$DRY_RUN" != true && -n "$SYNC_BRANCH" ]]; then
            if [[ -n "$VERIFY_REF" ]]; then
              git push origin "HEAD:refs/heads/$SYNC_BRANCH"
            else
              expected=$(git ls-remote origin "refs/heads/$SYNC_BRANCH" | cut -f1)
              if [[ -n "$expected" ]]; then
                git push --force-with-lease="refs/heads/$SYNC_BRANCH:$expected" origin "HEAD:refs/heads/$SYNC_BRANCH"
              else
                git push origin "HEAD:refs/heads/$SYNC_BRANCH"
              fi
            fi
          fi
          candidate=$(git rev-parse HEAD)
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          if [[ -s "$RUNNER_TEMP/dsh-codex/needs-decision.md" ]]; then
            echo 'needs_decision=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_decision=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload owner decision note
        if: steps.checkpoint.outputs.needs_decision == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-decision-note
          path: ${{ runner.temp }}/dsh-codex/needs-decision.md
          if-no-files-found: error
          retention-days: 3
      - name: Create exact source bundle
        id: bundle
        if: steps.checkpoint.outputs.needs_decision != 'true'
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          if [[ "$BASE_SHA" == "$candidate" ]]; then
            echo 'has_bundle=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git update-ref refs/dsh/verify "$candidate"
          if ! git merge-base --is-ancestor "$BASE_SHA" refs/dsh/verify; then
            git bundle create "$RUNNER_TEMP/source.bundle" refs/dsh/verify
          else
            git bundle create "$RUNNER_TEMP/source.bundle" "$BASE_SHA..refs/dsh/verify"
          fi
          git bundle verify "$RUNNER_TEMP/source.bundle" >/dev/null
          echo 'has_bundle=true' >> "$GITHUB_OUTPUT"
      - name: Upload exact source bundle
        if: steps.bundle.outputs.has_bundle == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-bundle-initial
          path: ${{ runner.temp }}/source.bundle
          if-no-files-found: error
          retention-days: 3

  verify_initial:
    needs: prepare
    if: >-
      needs.prepare.outputs.needs_decision != 'true' &&
      needs.prepare.outputs.candidate_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TARGET_TAG: ${{ needs.prepare.outputs.target_tag }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      DSH_DESKTOP_TARGET_PLATFORM: linux
      DSH_DESKTOP_TARGET_ARCH: x64
    outputs:
      result: ${{ steps.verify.outputs.result }}
      verified_sha: ${{ steps.verify.outputs.verified_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.prepare.outputs.has_bundle == 'true'
        with:
          name: source-bundle-initial
          path: ${{ runner.temp }}
      - name: Check out the bundled candidate
        run: |
          set -euo pipefail
          echo "DSH_DESKTOP_PACKAGE_CACHE_DIR=$RUNNER_TEMP/dsh-desktop-package-cache" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          cp -r scripts/linux-dist "$RUNNER_TEMP/linux-control"
          if [[ "${{ needs.prepare.outputs.has_bundle }}" == "true" ]]; then
            git bundle verify "$RUNNER_TEMP/source.bundle"
            git fetch --no-tags "$RUNNER_TEMP/source.bundle" "refs/dsh/verify:refs/dsh/verify"
            [[ "$(git rev-parse refs/dsh/verify)" == "$CANDIDATE_SHA" ]]
          fi
          git checkout --detach "$CANDIDATE_SHA"
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
      - name: Free disk space and install Linux dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y rpm xvfb dbus-x11 libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libsecret-1-0
          df -h
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.PNPM_CONFIG_STORE_DIR }}
            ${{ env.DSH_DESKTOP_PACKAGE_CACHE_DIR }}
          key: dsh-linux-package-cache-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: dsh-linux-package-cache-v1-
      - name: Verify bundled candidate
        id: verify
        run: |
          set -euo pipefail
          export TARGET_TAG=${TARGET_TAG:-$(cat scripts/linux-dist/state/last-synced-tag.txt)}
          retries=0
          while true; do
            sha=$(git rev-parse HEAD)
            echo "Verifying exact commit $sha"
            rm -f "$RUNNER_TEMP/linux-failure-stage" "$RUNNER_TEMP/linux-stage.log"
            if "$RUNNER_TEMP/linux-control/verify-linux.sh" >"$RUNNER_TEMP/linux-verify.log" 2>&1; then
              cat "$RUNNER_TEMP/linux-verify.log"
              git diff --exit-code HEAD
              {
                echo "result=passed"
                echo "verified_sha=$sha"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/linux-verify.log"
            if [[ ! -f "$RUNNER_TEMP/linux-failure-stage" ]]; then
              printf 'unknown\n' > "$RUNNER_TEMP/linux-failure-stage"
            fi
            stage=$(cat "$RUNNER_TEMP/linux-failure-stage")
            classification_log="$RUNNER_TEMP/linux-stage.log"
            [[ -f "$classification_log" ]] || classification_log="$RUNNER_TEMP/linux-verify.log"
            classification=$(node "$RUNNER_TEMP/linux-control/classify-failure.mjs" "$classification_log" "$stage")
            action=$(jq -r .action <<< "$classification")
            echo "$classification"
            if [[ "$action" == retry && $retries -lt 2 ]]; then
              retries=$((retries+1))
              sleep 10
              continue
            fi
            if [[ "$action" == heal ]]; then
              echo 'result=heal' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          done
      - name: Upload healable verification failure
        if: steps.verify.outputs.result == 'heal'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-failure-initial
          path: |
            ${{ runner.temp }}/linux-verify.log
            ${{ runner.temp }}/linux-failure-stage
          if-no-files-found: error
          retention-days: 3
      - name: Archive verified artifacts
        if: steps.verify.outputs.result == 'passed'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64-${{ steps.verify.outputs.verified_sha }}
          path: ${{ runner.temp }}/linux-release/*
          if-no-files-found: error

  heal:
    needs: [prepare, verify_initial]
    if: needs.verify_initial.outputs.result == 'heal'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_TAG: ${{ needs.prepare.outputs.target_tag }}
      VERIFY_REF: ${{ inputs.verify_ref }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      RELEASE_EXISTING: ${{ inputs.release }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      SYNC_BRANCH: sync/${{ needs.prepare.outputs.target_tag }}
      DSH_DESKTOP_TARGET_PLATFORM: linux
      DSH_DESKTOP_TARGET_ARCH: x64
    outputs:
      candidate_sha: ${{ steps.checkpoint.outputs.candidate_sha }}
      needs_decision: ${{ steps.checkpoint.outputs.needs_decision }}
      has_bundle: ${{ steps.bundle.outputs.has_bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.prepare.outputs.has_bundle == 'true'
        with:
          name: source-bundle-initial
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verify-failure-initial
          path: ${{ runner.temp }}
      - name: Check out the bundled candidate
        run: |
          set -euo pipefail
          echo "DSH_DESKTOP_PACKAGE_CACHE_DIR=$RUNNER_TEMP/dsh-desktop-package-cache" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          cp -r scripts/linux-dist "$RUNNER_TEMP/linux-control"
          if [[ "${{ needs.prepare.outputs.has_bundle }}" == "true" ]]; then
            git bundle verify "$RUNNER_TEMP/source.bundle"
            git fetch --no-tags "$RUNNER_TEMP/source.bundle" "refs/dsh/verify:refs/dsh/verify"
            [[ "$(git rev-parse refs/dsh/verify)" == "$CANDIDATE_SHA" ]]
          fi
          git checkout --detach "$CANDIDATE_SHA"
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
      - name: Free disk space and install Linux dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y rpm xvfb dbus-x11 libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libsecret-1-0
          df -h
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.PNPM_CONFIG_STORE_DIR }}
            ${{ env.DSH_DESKTOP_PACKAGE_CACHE_DIR }}
          key: dsh-linux-package-cache-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: dsh-linux-package-cache-v1-
      - name: Heal verified failure with bounded Codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/codex-cli" --no-audit --no-fund @openai/codex
          export PATH="$RUNNER_TEMP/codex-cli/node_modules/.bin:$PATH"
          "$RUNNER_TEMP/linux-control/prepare-codex-sandbox.sh"
          "$RUNNER_TEMP/linux-control/run-codex-heal.sh" "$RUNNER_TEMP/linux-verify.log"
      - name: Stage conflicts and publish healed checkpoint
        id: checkpoint
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/linux-control/stage-resolved-conflicts.sh"
          [[ -z "$(git status --porcelain --untracked-files=all -- .github/workflows .github/dependabot.yml scripts/linux-dist)" ]] || {
            echo 'Protected automation paths changed during healing' >&2
            exit 1
          }
          git add -A
          protected=$(git diff --cached --name-only -- .github/workflows .github/dependabot.yml scripts/linux-dist)
          [[ -z "$protected" ]] || { echo 'Automation files changed during healing' >&2; exit 1; }
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m "Repair Linux desktop verification for $TARGET_TAG"
          fi
          if [[ "$DRY_RUN" != true ]]; then
            git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          fi
          candidate=$(git rev-parse HEAD)
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          if [[ -s "$RUNNER_TEMP/dsh-codex/needs-decision.md" ]]; then
            echo 'needs_decision=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_decision=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload owner decision note
        if: steps.checkpoint.outputs.needs_decision == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-decision-note
          path: ${{ runner.temp }}/dsh-codex/needs-decision.md
          if-no-files-found: error
          retention-days: 3
      - name: Create healed source bundle
        id: bundle
        if: steps.checkpoint.outputs.needs_decision != 'true'
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          if [[ "$BASE_SHA" == "$candidate" ]]; then
            echo 'has_bundle=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git update-ref refs/dsh/verify "$candidate"
          if ! git merge-base --is-ancestor "$BASE_SHA" refs/dsh/verify; then
            git bundle create "$RUNNER_TEMP/source.bundle" refs/dsh/verify
          else
            git bundle create "$RUNNER_TEMP/source.bundle" "$BASE_SHA..refs/dsh/verify"
          fi
          git bundle verify "$RUNNER_TEMP/source.bundle" >/dev/null
          echo 'has_bundle=true' >> "$GITHUB_OUTPUT"
      - name: Upload healed source bundle
        if: steps.bundle.outputs.has_bundle == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-bundle-healed
          path: ${{ runner.temp }}/source.bundle
          if-no-files-found: error
          retention-days: 3

  verify_healed:
    needs: [prepare, heal]
    if: >-
      needs.heal.outputs.needs_decision != 'true' &&
      needs.heal.outputs.candidate_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TARGET_TAG: ${{ needs.prepare.outputs.target_tag }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      CANDIDATE_SHA: ${{ needs.heal.outputs.candidate_sha }}
      DSH_DESKTOP_TARGET_PLATFORM: linux
      DSH_DESKTOP_TARGET_ARCH: x64
    outputs:
      verified_sha: ${{ steps.verify.outputs.verified_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.heal.outputs.has_bundle == 'true'
        with:
          name: source-bundle-healed
          path: ${{ runner.temp }}
      - name: Check out the bundled candidate
        run: |
          set -euo pipefail
          echo "DSH_DESKTOP_PACKAGE_CACHE_DIR=$RUNNER_TEMP/dsh-desktop-package-cache" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
          cp -r scripts/linux-dist "$RUNNER_TEMP/linux-control"
          if [[ "${{ needs.heal.outputs.has_bundle }}" == "true" ]]; then
            git bundle verify "$RUNNER_TEMP/source.bundle"
            git fetch --no-tags "$RUNNER_TEMP/source.bundle" "refs/dsh/verify:refs/dsh/verify"
            [[ "$(git rev-parse refs/dsh/verify)" == "$CANDIDATE_SHA" ]]
          fi
          git checkout --detach "$CANDIDATE_SHA"
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
      - name: Free disk space and install Linux dependencies
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y rpm xvfb dbus-x11 libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libsecret-1-0
          df -h
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.PNPM_CONFIG_STORE_DIR }}
            ${{ env.DSH_DESKTOP_PACKAGE_CACHE_DIR }}
          key: dsh-linux-package-cache-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: dsh-linux-package-cache-v1-
      - name: Verify bundled candidate
        id: verify
        run: |
          set -euo pipefail
          export TARGET_TAG=${TARGET_TAG:-$(cat scripts/linux-dist/state/last-synced-tag.txt)}
          retries=0
          while true; do
            sha=$(git rev-parse HEAD)
            echo "Verifying exact commit $sha"
            rm -f "$RUNNER_TEMP/linux-failure-stage" "$RUNNER_TEMP/linux-stage.log"
            if "$RUNNER_TEMP/linux-control/verify-linux.sh" >"$RUNNER_TEMP/linux-verify.log" 2>&1; then
              cat "$RUNNER_TEMP/linux-verify.log"
              git diff --exit-code HEAD
              {
                echo "result=passed"
                echo "verified_sha=$sha"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/linux-verify.log"
            if [[ ! -f "$RUNNER_TEMP/linux-failure-stage" ]]; then
              printf 'unknown\n' > "$RUNNER_TEMP/linux-failure-stage"
            fi
            stage=$(cat "$RUNNER_TEMP/linux-failure-stage")
            classification_log="$RUNNER_TEMP/linux-stage.log"
            [[ -f "$classification_log" ]] || classification_log="$RUNNER_TEMP/linux-verify.log"
            classification=$(node "$RUNNER_TEMP/linux-control/classify-failure.mjs" "$classification_log" "$stage")
            action=$(jq -r .action <<< "$classification")
            echo "$classification"
            if [[ "$action" == retry && $retries -lt 2 ]]; then
              retries=$((retries+1))
              sleep 10
              continue
            fi
            exit 1
          done
      - name: Archive verified artifacts
        if: steps.verify.outputs.verified_sha != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64-${{ steps.verify.outputs.verified_sha }}
          path: ${{ runner.temp }}/linux-release/*
          if-no-files-found: error

  publish:
    needs: [prepare, verify_initial, heal, verify_healed]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.verify_initial.result != 'failure' && needs.verify_initial.result != 'cancelled' &&
      needs.heal.result != 'failure' && needs.heal.result != 'cancelled' &&
      needs.verify_healed.result != 'failure' && needs.verify_healed.result != 'cancelled' &&
      (needs.prepare.outputs.needs_decision == 'true' ||
       needs.verify_initial.outputs.verified_sha != '' ||
       needs.verify_healed.outputs.verified_sha != '') &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.prepare.outputs.target_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_TAG: ${{ needs.prepare.outputs.target_tag }}
      SYNC_BRANCH: sync/${{ needs.prepare.outputs.target_tag }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      CANDIDATE_SHA: ${{ needs.heal.outputs.candidate_sha || needs.prepare.outputs.candidate_sha }}
      VERIFIED_SHA: ${{ needs.verify_healed.outputs.verified_sha || needs.verify_initial.outputs.verified_sha }}
      NEEDS_DECISION: ${{ needs.prepare.outputs.needs_decision == 'true' || needs.heal.outputs.needs_decision == 'true' }}
      VERIFY_REF: ${{ inputs.verify_ref }}
      RELEASE_EXISTING: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
      - name: Configure merge identity
        run: |
          git config user.name 'kazv'
          git config user.email '70378740+k-azv@users.noreply.github.com'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.NEEDS_DECISION == 'true'
        with:
          name: linux-decision-note
          path: ${{ runner.temp }}/linux-decision
      - name: Open or update sync PR and decision pause
        id: pr
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/linux-pr.md"
          args=()
          if [[ "$NEEDS_DECISION" == true ]]; then
            printf 'Sync upstream `%s` into Linux downstream, preserving merge ancestry.\n\nHead: `%s`\n\n' \
              "$TARGET_TAG" "$CANDIDATE_SHA" > "$body"
            cat "$RUNNER_TEMP/linux-decision/needs-decision.md" >> "$body"
            printf '\nOwner: reply with `/decide <instruction>` to continue.\n' >> "$body"
            args+=(--draft)
          else
            printf 'Sync upstream `%s` into Linux downstream, preserving merge ancestry.\n\nHead: `%s`\n' \
              "$TARGET_TAG" "$VERIFIED_SHA" > "$body"
            printf '\nValidation: RPM and AppImage build, packaged runtime, Xvfb GUI/Host, Fedora RPM install and version ordering.\n' >> "$body"
          fi
          number=$(gh pr list --base linux --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$number" ]]; then
            gh pr create --base linux --head "$SYNC_BRANCH" --title "Linux sync $TARGET_TAG" --body-file "$body" "${args[@]}"
            number=$(gh pr list --base linux --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')
          else
            gh pr edit "$number" --body-file "$body"
          fi
          is_draft=$(gh pr view "$number" --json isDraft --jq .isDraft)
          has_decision_label=$(gh pr view "$number" --json labels --jq '[.labels[].name] | index("needs-decision")')
          if [[ "$NEEDS_DECISION" == true ]]; then
            gh label create needs-decision --color D4C5F9 --description 'Owner decision required' --force
            if [[ "$is_draft" != true ]]; then
              gh pr ready "$number" --undo
            fi
            gh pr edit "$number" --add-label needs-decision
          else
            if [[ "$is_draft" == true ]]; then
              gh pr ready "$number"
            fi
            if [[ "$has_decision_label" != null ]]; then
              gh pr edit "$number" --remove-label needs-decision
            fi
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.NEEDS_DECISION != 'true'
        with:
          name: linux-x64-${{ needs.verify_healed.outputs.verified_sha || needs.verify_initial.outputs.verified_sha }}
          path: ${{ runner.temp }}/linux-release
      - name: Merge verified sync atomically and publish exact artifacts
        if: >-
          github.event_name == 'workflow_dispatch' &&
          env.NEEDS_DECISION != 'true' &&
          (env.VERIFY_REF == '' || env.RELEASE_EXISTING == 'true')
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          [[ -n "$VERIFIED_SHA" && "$VERIFIED_SHA" == "$CANDIDATE_SHA" ]]
          pr=$(gh pr view "$PR_NUMBER" --json headRefOid,baseRefName,state,isDraft,labels)
          [[ $(jq -r .headRefOid <<< "$pr") == "$VERIFIED_SHA" ]]
          [[ $(jq -r .baseRefName <<< "$pr") == linux ]]
          [[ $(jq -r .state <<< "$pr") == OPEN ]]
          [[ $(jq -r .isDraft <<< "$pr") == false ]]
          [[ $(jq -r '[.labels[].name] | index("needs-decision")' <<< "$pr") == null ]]
          release_tag="$TARGET_TAG-linux.1"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists" >&2
            exit 1
          fi
          git fetch origin "refs/heads/linux:refs/remotes/origin/linux" "$VERIFIED_SHA"
          [[ $(git rev-parse origin/linux) == "$BASE_SHA" ]] || {
            echo 'linux advanced; dispatch a fresh sync and verification' >&2
            exit 1
          }
          [[ $(git rev-parse "$VERIFIED_SHA^{commit}") == "$VERIFIED_SHA" ]]
          git merge-base --is-ancestor "$BASE_SHA" "$VERIFIED_SHA"
          merged=$(git commit-tree "$VERIFIED_SHA^{tree}" -p "$BASE_SHA" -p "$VERIFIED_SHA" \
            -m "Merge pull request #$PR_NUMBER from $GITHUB_REPOSITORY/$SYNC_BRANCH")
          [[ $(git rev-parse "$merged^{tree}") == "$(git rev-parse "$VERIFIED_SHA^{tree}")" ]]
          git push --force-with-lease="refs/heads/linux:$BASE_SHA" origin "$merged:refs/heads/linux"
          (cd "$RUNNER_TEMP/linux-release" && sha256sum -c SHA256SUMS.txt)
          release_args=(--target "$merged" --title "$TARGET_TAG Linux 1"
            --notes "Unofficial Linux x64 build. Verified source: $VERIFIED_SHA. SHA256SUMS.txt contains artifact checksums.")
          if [[ "$TARGET_TAG" == *-rc.* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$release_tag" "${release_args[@]}" "$RUNNER_TEMP/linux-release/"*
