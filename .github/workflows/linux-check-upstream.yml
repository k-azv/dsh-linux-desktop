name: Linux upstream release check
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: linux-upstream-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linux
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Find newer stable or rc release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/linux-dist/check-upstream-release.mjs
      - name: Dispatch sync explicitly
        if: steps.release.outputs.target_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.release.outputs.target_tag }}
        run: gh workflow run linux-sync-and-build.yml --ref linux -f target_tag="$TARGET_TAG" -f dry_run=false
