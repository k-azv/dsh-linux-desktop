name: Linux upstream release check
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: linux-upstream-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: linux
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Find newer stable or rc release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/linux-dist/check-upstream-release.mjs
      - name: Dispatch sync explicitly
        if: steps.release.outputs.target_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.release.outputs.target_tag }}
        run: |
          set -euo pipefail
          open=$(gh pr list --base linux --state open --json number,headRefName,labels \
            --jq '[.[] | select(.headRefName | startswith("sync/"))]')
          if [[ $(jq length <<< "$open") -gt 0 ]]; then
            echo 'An open sync PR is already in flight; skipping dispatch:' >&2
            jq -c '.[] | {number, headRefName, labels: [.labels[].name]}' <<< "$open" >&2
            exit 0
          fi
          gh workflow run linux-sync-and-build.yml --ref linux -f target_tag="$TARGET_TAG" -f dry_run=false
